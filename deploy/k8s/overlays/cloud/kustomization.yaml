# Cloud overlay: spread pods across zones; use the cluster's default fast StorageClass.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: { kind: StatefulSet, name: rkv-store }
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app: rkv-store } } }
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 50Gi
