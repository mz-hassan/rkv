apiVersion: v1
kind: Service
metadata: { name: rkv-pd, namespace: rkv, labels: { app: rkv-pd } }
spec:
  clusterIP: None
  publishNotReadyAddresses: true     # peers must resolve each other before they are Ready
  selector: { app: rkv-pd }
  ports: [{ name: grpc, port: 2379 }]
---
apiVersion: v1
kind: Service
metadata: { name: rkv-store, namespace: rkv, labels: { app: rkv-store } }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: rkv-store }
  ports: [{ name: grpc, port: 20160 }, { name: http, port: 20180 }]
---
# stable client entry point (any ready store can serve routing + data)
apiVersion: v1
kind: Service
metadata: { name: rkv-client, namespace: rkv }
spec:
  selector: { app: rkv-store }
  ports: [{ name: grpc, port: 20160 }]
