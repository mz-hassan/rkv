[package]
name = "chaos"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rkv-chaos"
path = "src/main.rs"

[dependencies]
kv-client = { path = "../kv-client" }
rkv-proto = { path = "../rkv-proto" }
lincheck = { path = "../lincheck" }
ycsb = { path = "../ycsb" }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1"
