[package]
name = "raft-driver"
version.workspace = true
edition.workspace = true

[dependencies]
raft = { path = "../raft" }
raft-storage = { path = "../raft-storage" }
kv-engine = { path = "../kv-engine" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
